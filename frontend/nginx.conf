server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Must be a little above the API's own upload limit (10 MB by default), so the API gives the readable
    # error message instead of nginx answering with a bare 413 page.
    client_max_body_size 12m;

    # ^~ gives this prefix priority over the regex location below. Without it, /api/.../pages/1.png would be
    # taken for a static asset (it ends in .png) and answered with an nginx 404 instead of reaching the API.
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite, not append: a client-supplied X-Forwarded-For must never reach the API's rate limiter.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Hashed build artefacts can be cached for a long time.
    location ~* \.(?:js|css|woff2?|ico|svg|png)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
