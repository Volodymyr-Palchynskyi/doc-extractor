name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      # No API key on purpose: tests use fakes, and the synthetic datasets are committed.
      - run: uv run pytest -q
      # The oracle extractor returns the ground truth, so this must score 100%: it proves the eval
      # harness and the dataset still agree with each other.
      - run: uv run python -m evals --split dev --extractor oracle --tag ci-oracle

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      # The production build also type-checks every template.
      - run: npx ng build --configuration production

  docker:
    name: Full stack smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack (no API key, so demo mode)
        run: docker compose up -d --build --wait --wait-timeout 300
      # Drives the stack through the nginx proxy like a browser: upload a sample, validator flags the wrong
      # total, page image arrives as a PNG, re-validation, refusals, delete. See scripts/smoke.sh.
      - name: Smoke test
        run: bash scripts/smoke.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
