name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      # No API key on purpose: tests use fakes, and the synthetic datasets are committed.
      - run: uv run pytest -q
      # The oracle extractor returns the ground truth, so this must score 100%: it proves the eval
      # harness and the dataset still agree with each other.
      - run: uv run python -m evals --split dev --extractor oracle --tag ci-oracle

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build and start (no API key, no .env)
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Health endpoint answers
        run: curl -fsS http://localhost:8000/health
      - name: Missing API key degrades to 503, not a crash
        run: test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -F 'file=@backend/evals/dataset/dev/dev-easy-00.pdf;type=application/pdf' http://localhost:8000/api/v1/extractions)" = "503"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
